<section class="clients-section">
  <div class="container">
    <app-section-title
      badge="Our partners"
      title="Trusted by teams across Egypt"
      subtitle="Organizations that choose Infinity Tecs for dependable equipment and ongoing support."
      [centered]="true"
    ></app-section-title>
    <div class="partner-grid" aria-label="Infinity Tecs partners">
      <div class="partner-logo-tile" *ngFor="let client of clients" [class.dark-logo]="client.name === 'JW Marriott' || client.name === 'The Address'">
        <img [src]="client.logo" [alt]="client.name" class="client-logo-img" loading="lazy" />
      </div>
    </div>
  </div>
</section>
