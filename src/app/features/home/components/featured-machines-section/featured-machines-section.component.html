<section class="featured-section">
  <div class="container">
    <app-section-title
      badge="The collection"
      title="Considered equipment, chosen to perform"
      subtitle="A selection of dependable Italian-made vending machines and systems, ready for your space."
      [centered]="true"
    ></app-section-title>

    <!-- Filter Category Chips -->
    <div class="filter-tabs">
      <button 
        class="filter-chip" 
        [class.active]="selectedFilter === 'all'"
        (click)="filterCategory('all')"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Available Picks
      </button>
      <button 
        class="filter-chip" 
        [class.active]="selectedFilter === 'coffee'"
        (click)="filterCategory('coffee')"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        Espresso & Coffee
      </button>
      <button 
        class="filter-chip" 
        [class.active]="selectedFilter === 'snacks'"
        (click)="filterCategory('snacks')"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/><line x1="2" y1="15" x2="22" y2="15"/></svg>
        Snacks & Food
      </button>
    </div>

    <!-- Machines Grid -->
    <div class="machines-grid">
      <div 
        class="grid-item" 
        *ngFor="let machine of filteredMachines; let i = index"
        appScrollReveal
        [revealDelay]="i * 0.08"
      >
        <app-machine-card [machine]="machine"></app-machine-card>
      </div>
    </div>

    <!-- View All Catalog Button -->
    <div class="catalog-cta">
      <a routerLink="/vending-solutions" class="btn-full-catalog">
        <span>Explore Full Catalog</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</section>
