<section class="why-us-section">
  <div class="container">
    <app-section-title
      badge="The Infinity difference"
      title="Italian quality. Egyptian aftercare."
      subtitle="Carefully chosen machines, installed by our team and supported well beyond day one."
      [centered]="true"
    ></app-section-title>

    <div class="pillars-grid">
      <!-- PILLAR 1: WHY CHOOSING US -->
      <div class="pillar-card pillar-left" appScrollReveal>
        <div class="pillar-header">
          <div class="pillar-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
          </div>
          <div class="pillar-titles">
            <span class="pillar-badge">Italian equipment</span>
            <h3 class="pillar-name">{{ pillar1.title }}</h3>
            <p class="pillar-sub">{{ pillar1.subtitle }}</p>
          </div>
        </div>

        <ul class="pillar-points">
          <li *ngFor="let pt of pillar1.points">
            <svg class="point-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            <span>{{ pt }}</span>
          </li>
        </ul>
      </div>

      <!-- PILLAR 2: WHY VENDING -->
      <div class="pillar-card pillar-right" appScrollReveal [revealDelay]="0.15">
        <div class="pillar-header">
          <div class="pillar-icon green-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </div>
          <div class="pillar-titles">
            <span class="pillar-badge green-badge">Local aftercare</span>
            <h3 class="pillar-name">{{ pillar2.title }}</h3>
            <p class="pillar-sub">{{ pillar2.subtitle }}</p>
          </div>
        </div>

        <ul class="pillar-points">
          <li *ngFor="let pt of pillar2.points">
            <svg class="point-icon green-pt" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            <span>{{ pt }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
